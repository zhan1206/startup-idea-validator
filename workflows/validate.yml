name: Startup Idea Validation

on:
  workflow_dispatch:
    inputs:
      idea:
        description: '创业想法描述'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Run validation
      run: |
        python scripts/startup_validator.py --idea "${{ github.event.inputs.idea }}" --output ./validation-report
    
    - name: Display results
      run: |
        echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f ./validation-report/startup-validation-report.md ]; then
          head -50 ./validation-report/startup-validation-report.md >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: validation-report
        path: |
          ./validation-report/
        retention-days: 30
